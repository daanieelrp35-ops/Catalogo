<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catálogo Capilar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header">
      <div class="container">
        <div class="brand">
          <span class="brand-mark">C</span>
          <h1>Catálogo Capilar</h1>
        </div>
      </div>
    </header>

    <main class="container">
      <section class="toolbar">
        <div class="search-box">
          <label for="searchInput">Buscar producto</label>
          <input id="searchInput" type="text" placeholder="Ej: shampoo" />
        </div>

        <div class="filter-box">
          <label for="categoryFilter">Categoría</label>
          <select id="categoryFilter">
            <option value="all">Todas</option>
          </select>
        </div>
      </section>

     <div id="productGrid" class="product-grid" aria-live="polite">
  <article class="product-card">
    <img
      src="https://daanieelrp35-ops.github.io/Catalogo/01.jpeg"
      alt="Producto 1"
      class="product-image"
    />
  </article>
</div>

    <a
      class="whatsapp-button"
      href="https://api.whatsapp.com/send?phone=3517692619&text=Hola%20quiero%20m%C3%A1s%20informaci%C3%B3n%20sobre%20el%20cat%C3%A1logo"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Chatear por WhatsApp"
    >
      <span class="whatsapp-icon">WhatsApp</span>
    </a>

    <script src="script.js"></script>
  </body>
</html>
